<div class="flex flex-col gap-6 px-8 pb-8 pt-12 text-main">
  <div class="mb-4 flex flex-col items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-12 text-primary">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>
    <h2 class="m-0 text-center text-3xl font-semibold text-main">Iniciar Sesión</h2>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-4 flex flex-col gap-2">
      <label for="email" class="ml-1 text-sm font-medium text-subtle">Email:</label>
      <div class="group relative flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
             class="pointer-events-none absolute left-3 size-5 text-muted transition-colors group-focus-within:text-primary">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <input id="email" name="email" type="email" formControlName="email"
               placeholder="Introduce tu email" autocomplete="email"
               class="w-full rounded-lg border border-border-light bg-white/10 py-3 pl-10 pr-4 text-base text-main transition focus:border-primary focus:bg-white/15 focus:outline-none">
      </div>
    </div>

    <div class="mb-6 flex flex-col gap-2">
      <label for="password" class="ml-1 text-sm font-medium text-subtle">Contraseña:</label>
      <div class="group relative flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
             class="pointer-events-none absolute left-3 size-5 text-muted transition-colors group-focus-within:text-primary">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
        <input id="password" name="password" type="password" formControlName="password"
               placeholder="Introduce tu contraseña" autocomplete="current-password"
               class="w-full rounded-lg border border-border-light bg-white/10 py-3 pl-10 pr-4 text-base text-main transition focus:border-primary focus:bg-white/15 focus:outline-none">
      </div>
    </div>

    @if (errorMessage) {
    <div class="mb-6 rounded-lg border border-danger/30 bg-danger/10 p-4 text-center text-danger" role="alert">{{ errorMessage }}</div>
    }

    <button type="submit" class="submit-button" [disabled]="loginForm.invalid || isLoading">
      @if (isLoading) { <span class="loader"></span> } @else { Entrar }
    </button>
  </form>

  <div class="mt-4 text-center text-sm text-muted">
    ¿No tienes cuenta?
    <button type="button" (click)="onSwitchToRegister()"
            class="cursor-pointer border-0 bg-transparent p-0 font-medium text-primary hover:text-primary-hover hover:underline">Regístrate</button>
  </div>
</div>
